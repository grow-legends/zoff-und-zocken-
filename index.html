<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zoff &amp; Zocken</title>
<meta name="description" content="Minispiele-Arena für Freunde mit Tagesrunde, Turnieren und Bestenlisten.">
<meta name="theme-color" content="#2A45DA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='25' fill='%23E3412A'/%3E%3Cpath d='M20 12c6 2 10 6 12 12 2-6 6-10 12-12' stroke='%23169A5A' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Martian+Mono:wght@400;600;800&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Spielhallen-Wand – drückbare Kacheln auf kühlem Papier, Anzeigetafel-Ziffern für Punkte. Handy: eine Spalte + Tab-Leiste unten. Desktop: Hauptspalte + Seitenleiste mit Live-Ticker. */
:root{
  --bg:#EBEFF7; --surface:#FFFFFF; --surface-2:#DEE4F1; --ink:#141A33; --ink-2:#545D80; --line:#C7CFE3;
  --tomato:#E3412A; --cobalt:#2A45DA; --gold:#DB9C00; --mint:#0C9786; --violet:#7044D4;
  --good:#16955A; --bad:#CF311E; --on-accent:#FFFFFF; --on-gold:#2A1E00; --scrim:rgba(20,26,51,.5);
  --f-display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1429; --surface:#182042; --surface-2:#222B54; --ink:#EDF0FA; --ink-2:#A3ABCD; --line:#2F3A6C;
  --tomato:#FF6649; --cobalt:#7A8EFF; --gold:#FFC63A; --mint:#2FD0B8; --violet:#A688FF;
  --good:#3AD07F; --bad:#FF6B5B; --on-accent:#0E1228; --on-gold:#2A1E00; --scrim:rgba(3,6,18,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1429; --surface:#182042; --surface-2:#222B54; --ink:#EDF0FA; --ink-2:#A3ABCD; --line:#2F3A6C;
  --tomato:#FF6649; --cobalt:#7A8EFF; --gold:#FFC63A; --mint:#2FD0B8; --violet:#A688FF;
  --good:#3AD07F; --bad:#FF6B5B; --on-accent:#0E1228; --on-gold:#2A1E00; --scrim:rgba(3,6,18,.65); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg)}
body{margin:0}
img{max-width:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.digits{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.02em}
.muted{color:var(--ink-2)}
.fine{font-size:13px;color:var(--ink-2)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.ic{display:inline-grid;place-items:center;line-height:0}
.ic svg{width:22px;height:22px}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-size:19px;line-height:1;letter-spacing:.01em;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink);white-space:nowrap}
.logo .amp{color:var(--tomato)}
.topnav{display:none;gap:2px}
.topnav button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:700;color:var(--ink-2);cursor:pointer}
.topnav button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.mode{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--ink-2);white-space:nowrap}
.mode::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.mode.shared::before{background:var(--good)}
.mechip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 6px;font-weight:700;cursor:pointer;min-width:0;max-width:150px}
.mechip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mechip .em{font-size:18px;line-height:1}
body.ingame .topnav,body.ingame .logo,body.ingame .mechip{pointer-events:none;opacity:.5}

main#view{max-width:1140px;margin:0 auto;padding-block:18px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.ingame main#view{padding-block:12px 28px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:700;color:var(--ink-2);cursor:pointer}
.tabbar button[aria-current="page"]{color:var(--tomato)}
body.ingame .tabbar{display:none}
@media (min-width:860px){.tabbar{display:none}.topnav{display:flex}main#view{padding-block:26px 48px}}

/* ---------- Buttons ---------- */
.btn{--b:var(--surface-2);--t:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;line-height:1.1;padding:12px 16px;border-radius:12px;border:0;background:var(--b);color:var(--t);box-shadow:0 4px 0 color-mix(in oklab,var(--b) 72%,#000);cursor:pointer;transition:transform .06s,box-shadow .06s;touch-action:manipulation;text-align:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in oklab,var(--b) 72%,#000)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{--b:var(--tomato);--t:var(--on-accent)}
.btn.blue{--b:var(--cobalt);--t:var(--on-accent)}
.btn.good{--b:var(--good);--t:var(--on-accent)}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.lg{padding:15px 18px;font-size:16px}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- Cards & sections ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-head h2,.sec-title{font-family:var(--f-display);font-size:17px;font-weight:400;letter-spacing:.01em}
.sec-title{margin:22px 0 10px}
.page{display:grid;gap:14px}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.page-title{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,6vw,38px);line-height:1}
.lede{max-width:62ch;color:var(--ink-2)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:18px;color:var(--ink-2);text-align:center}
.note{border-radius:14px;padding:12px 14px;background:var(--surface-2);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:color-mix(in oklab,var(--gold) 22%,var(--surface))}
.note b{font-weight:800}

/* ---------- Home ---------- */
.home{display:grid;gap:18px}
.home-main,.home-side{display:grid;gap:18px;min-width:0;align-content:start}
@media (min-width:980px){.home{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.home-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
.hero{background:var(--cobalt);color:var(--on-accent);border-radius:22px;padding:20px 20px 18px;box-shadow:0 6px 0 color-mix(in oklab,var(--cobalt) 65%,#000);background-image:repeating-linear-gradient(-45deg,transparent 0 22px,color-mix(in oklab,var(--on-accent) 7%,transparent) 22px 44px);display:grid;gap:12px;overflow:hidden}
.hero-eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero-title{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,8vw,48px);line-height:.95;word-break:break-word}
.hero-spruch{font-size:15px;font-weight:600;opacity:.9;max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:color-mix(in oklab,var(--on-accent) 14%,transparent);border-radius:12px;padding:8px 12px;display:grid;gap:2px;min-width:92px}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}

.daily-dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (min-width:560px){.daily-dots{grid-template-columns:repeat(13,minmax(0,1fr))}}
.dd{display:grid;justify-items:center;gap:4px;border:2px dashed var(--line);background:transparent;border-radius:12px;padding:8px 2px 6px;cursor:pointer;color:var(--ink-2)}
.dd .ic svg{width:20px;height:20px}
.dd.done{border-style:solid;border-color:var(--c);background:var(--c);color:var(--oc)}
.dd-v{font-size:11px}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1180px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:grid;gap:6px;align-content:start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .06s,box-shadow .06s;min-width:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile:hover{border-color:var(--c)}
.tile-top{display:flex;align-items:center;gap:8px}
.tile-ic{width:40px;height:40px;border-radius:12px;background:var(--c);color:var(--oc);display:grid;place-items:center;flex:none}
.tile-ic.sm{width:30px;height:30px;border-radius:9px}
.tile-ic.sm svg{width:17px;height:17px}
.tile-ic.lg{width:56px;height:56px;border-radius:16px}
.tile-ic.lg svg{width:30px;height:30px}
.tile-cat{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tile-done{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--good);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:800}
.tile-name{font-family:var(--f-display);font-size:16px;line-height:1.05;word-break:break-word}
.tile-desc{font-size:13px;color:var(--ink-2);line-height:1.35}
.tile-foot{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:2px}
.tile-foot b{color:var(--ink)}
.tile-crown{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.people{display:grid;gap:8px}
.person{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--surface-2)}
.person .em{font-size:24px;line-height:1;width:34px;text-align:center}
.person-t{display:grid;min-width:0;flex:1}
.person-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-t span{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{font-size:12px;font-weight:800;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:ping 2s infinite}
.live.off::before{background:var(--ink-2);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

.ticker{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.tk{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tk:last-child{border-bottom:0}
.tk .em{font-size:22px;text-align:center}
.tk-t{min-width:0;font-size:13.5px;line-height:1.3}
.tk-t b{font-weight:800}
.tk-t small{display:block;color:var(--ink-2);font-size:12px}
.tk-p{font-size:15px;text-align:right}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px}
.tag.d{background:color-mix(in oklab,var(--tomato) 18%,var(--surface));color:var(--tomato)}
.tag.t{background:color-mix(in oklab,var(--cobalt) 18%,var(--surface));color:var(--cobalt)}
.tag.r{background:color-mix(in oklab,var(--gold) 30%,var(--surface));color:var(--ink)}

/* ---------- Sheet ---------- */
#sheet{position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center;background:var(--scrim)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease;display:grid;gap:14px}
@media (min-width:700px){#sheet{align-items:center;padding:24px}.sheet-panel{border-radius:22px;padding:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);font-size:18px;font-weight:800;cursor:pointer}
.gs-head{display:flex;gap:14px;align-items:center;padding-right:40px}
.gs-title{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.05}
.gs-rules{color:var(--ink-2);max-width:60ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.gs-actions{display:grid;gap:10px}
.gs-done{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-weight:600}
.minirank{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:14px}
.minirank li{display:flex;justify-content:space-between;gap:10px}
.field{display:grid;gap:6px}
.field-l{font-weight:800;font-size:13px;display:flex;gap:8px;align-items:baseline}
.inp{width:100%;font:600 16px var(--f-body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.inp:focus{border-color:var(--cobalt);outline:none}
.avatars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.av{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0}
.av[aria-pressed="true"]{border-color:var(--tomato);background:color-mix(in oklab,var(--tomato) 16%,var(--surface))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px 6px 6px;font-weight:700;font-size:13px;cursor:pointer}
.chip-btn .ic{width:24px;height:24px;border-radius:7px;background:var(--surface-2)}
.chip-btn .ic svg{width:15px;height:15px}
.chip-btn[aria-pressed="true"]{border-color:var(--c)}
.chip-btn[aria-pressed="true"] .ic{background:var(--c);color:var(--oc)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg-b{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg-b[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.err{color:var(--bad);font-weight:700;font-size:14px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--tomato)}

/* ---------- Toasts & FX ---------- */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(460px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);animation:tin .25s ease}
.toast.big{background:var(--gold);color:var(--on-gold);font-weight:800;font-size:15px}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.splat{position:absolute;width:min(72vw,380px);transform-origin:center;animation:splat 3.2s ease forwards}
@keyframes splat{0%{transform:scale(.2) rotate(var(--rot));opacity:0}7%{transform:scale(1.1) rotate(var(--rot));opacity:1}13%{transform:scale(1) rotate(var(--rot))}70%{opacity:1;translate:0 16px}100%{opacity:0;translate:0 70px;transform:scale(1) rotate(var(--rot))}}
.fx-word{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;font-family:var(--f-display);font-size:clamp(38px,13vw,104px);line-height:1;color:var(--tomato);text-shadow:4px 4px 0 var(--ink);animation:pop 1.6s ease forwards}
.fx-word small{display:block;font-family:var(--f-body);font-weight:800;font-size:18px;text-shadow:none;color:var(--ink);margin-top:10px}
@keyframes pop{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.clown{position:absolute;top:-70px;font-size:46px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 140px)) rotate(540deg)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
.dizzy{animation:dizzy 3.2s ease-in-out}
@keyframes dizzy{0%,100%{transform:none;filter:none}15%{transform:rotate(-5deg) scale(.97);filter:hue-rotate(70deg) blur(1px)}35%{transform:rotate(5deg) scale(.96);filter:hue-rotate(160deg)}55%{transform:rotate(-4deg) skewX(4deg);filter:hue-rotate(250deg) blur(1.5px)}75%{transform:rotate(3deg);filter:hue-rotate(320deg)}}
@media (prefers-reduced-motion:reduce){.dizzy,.shake{animation:none}.clown{display:none}.splat{animation:fade 3s ease forwards;transform:rotate(var(--rot))}.live::before{animation:none}}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}

/* ---------- Game shell ---------- */
.game{display:grid;gap:12px;max-width:760px;margin:0 auto}
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gbar-t{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.gbar-name{font-family:var(--f-display);font-size:18px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.mchip.d{background:var(--tomato);color:var(--on-accent)}
.mchip.t{background:var(--cobalt);color:var(--on-accent)}
.confirm{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:color-mix(in oklab,var(--tomato) 14%,var(--surface));border:2px solid var(--tomato);border-radius:14px;padding:10px 12px;font-weight:700}
.confirm span{flex:1 1 200px}
.stage{min-width:0}
.g-msg{text-align:center;color:var(--ink-2);font-weight:600;min-height:1.45em}
.g-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;color:var(--ink-2);font-size:14px;flex-wrap:wrap}
.g-head .digits{color:var(--ink)}
.tbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--tomato);border-radius:99px}

.result{display:grid;justify-items:center;gap:12px;text-align:center;padding-block:10px 4px}
.result-score{font-family:var(--f-mono);font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(68px,22vw,128px);line-height:.9;letter-spacing:-.05em}
.result-label{font-family:var(--f-display);font-size:14px;letter-spacing:.12em;color:var(--ink-2)}
.result-d{font-size:18px;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.badge{padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px;background:var(--surface-2)}
.badge.gold{background:var(--gold);color:var(--on-gold)}
.badge.good{background:var(--good);color:var(--on-accent)}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}

/* Wortjagd */
.wj{display:grid;gap:12px;justify-items:center}
.wj-grid{display:grid;gap:6px}
.wj-row{display:grid;grid-template-columns:repeat(5,min(14.5vw,58px));gap:6px}
.wj-tile{aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--line);border-radius:9px;font-family:var(--f-display);font-size:min(7vw,27px);background:var(--surface);transition:background .2s,border-color .2s}
.wj-tile.filled{border-color:var(--ink-2);animation:tick .1s}
@keyframes tick{50%{transform:scale(1.07)}}
.wj-tile.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.s-g{background:var(--good)!important;border-color:var(--good)!important;color:var(--on-accent)!important}
.s-y{background:var(--gold)!important;border-color:var(--gold)!important;color:var(--on-gold)!important}
.s-x{background:var(--ink-2)!important;border-color:var(--ink-2)!important;color:var(--surface)!important}
.wj-kb{display:grid;gap:6px;width:100%;max-width:560px}
.wj-krow{display:flex;gap:4px;justify-content:center}
.wj-key{flex:1 1 0;min-width:0;height:52px;border:0;border-radius:8px;background:var(--surface-2);font-weight:800;font-size:15px;padding:0;cursor:pointer;touch-action:manipulation}
.wj-key.wide{flex:1.6 1 0;font-size:12px}

/* Quiz */
.qz{display:grid;gap:14px}
.qz-q{font-size:clamp(19px,4.6vw,25px);font-weight:800;line-height:1.25;min-height:3.8em;display:flex;align-items:center}
.qz-opts{display:grid;gap:10px}
@media (min-width:620px){.qz-opts{grid-template-columns:1fr 1fr}}
.qz-opt{justify-content:flex-start;text-align:left;padding:15px 16px;font-size:16px;min-height:58px}
.qz-opt.ok{--b:var(--good);--t:var(--on-accent)}
.qz-opt.no{--b:var(--bad);--t:var(--on-accent)}
.qz-opt:disabled{opacity:1;cursor:default}

/* Keypad */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px;margin:0 auto}
.kp-k{font-size:22px;padding:14px 0;font-family:var(--f-mono);font-weight:800}
.kp-ok{grid-column:1/-1}
.numdisp{font-family:var(--f-mono);font-weight:800;font-size:clamp(28px,9vw,44px);text-align:center;padding:12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);min-height:1.6em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.numdisp.empty{color:var(--ink-2)}
.unit{font-size:.45em;color:var(--ink-2);margin-left:6px}

/* Schätz */
.sz{display:grid;gap:14px}
.sz-q{font-size:clamp(18px,4.4vw,23px);font-weight:800;line-height:1.3}
.reveal{display:grid;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px}
.reveal-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.reveal-row b{font-family:var(--f-mono);font-size:20px}
.meter{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .6s ease}

/* Zeitstrahl */
.zs{display:grid;gap:12px}
.zs-cur{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;background:var(--violet);color:var(--on-accent);border-radius:16px;padding:14px 16px;font-weight:800;font-size:17px;box-shadow:0 5px 0 color-mix(in oklab,var(--violet) 65%,#000)}
.zs-cur small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.zs-cur.no{background:var(--bad)}
.zs-list{display:grid;gap:4px}
.zs-slot{border:2px dashed var(--line);background:transparent;border-radius:10px;min-height:38px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
.zs-slot:hover:not(:disabled){border-color:var(--violet);color:var(--violet);background:color-mix(in oklab,var(--violet) 8%,transparent)}
.zs-card{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:600}
.zs-card.ok{border-color:var(--good);animation:tick .3s}
.zs-year{font-size:15px;color:var(--violet)}

/* Höher/Tiefer */
.hl{display:grid;gap:12px}
.hl-cards{display:grid;gap:10px}
@media (min-width:620px){.hl-cards{grid-template-columns:1fr auto 1fr;align-items:stretch}}
.hl-card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;align-content:center;text-align:center;min-height:130px}
.hl-card.ok{border-color:var(--good)}
.hl-card.no{border-color:var(--bad)}
.hl-name{font-size:20px;font-weight:800;line-height:1.2}
.hl-val{font-family:var(--f-mono);font-weight:800;font-size:clamp(24px,7vw,34px);font-variant-numeric:tabular-nums}
.hl-vs{font-family:var(--f-display);color:var(--ink-2);display:grid;place-items:center;font-size:18px}
.hl-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Golf & Kreis */
.golf-hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.golf-hud .digits{font-size:16px}
.golf-wrap,.kr-wrap{display:grid;justify-items:center;position:relative}
.golf-cv{touch-action:none;border-radius:16px;box-shadow:0 6px 0 #1E5428;cursor:crosshair}
.kr-cv{touch-action:none;border-radius:18px;background:var(--surface);border:2px solid var(--line);cursor:crosshair;max-width:100%}
.kr-live{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:26px;pointer-events:none}
.kr-tries{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.kr-try{padding:6px 12px;border-radius:10px;background:var(--surface-2);font-family:var(--f-mono);font-weight:800;font-size:14px}
.kr-try.best{background:var(--gold);color:var(--on-gold)}

/* Reaktion */
.rx-panel{width:100%;min-height:min(56vh,420px);border:0;border-radius:22px;display:grid;place-items:center;align-content:center;gap:8px;text-align:center;font-family:var(--f-display);font-size:clamp(26px,8vw,46px);background:var(--surface-2);color:var(--ink);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:20px}
.rx-panel small{font-family:var(--f-body);font-size:15px;font-weight:700;color:inherit;opacity:.8}
.rx-panel.wait{background:var(--tomato);color:var(--on-accent)}
.rx-panel.fake{background:var(--cobalt);color:var(--on-accent)}
.rx-panel.go{background:var(--good);color:var(--on-accent)}
.rx-list{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Zeitgefühl */
.tg{display:grid;gap:16px;justify-items:center;text-align:center}
.tg-target{font-family:var(--f-display);font-size:clamp(22px,6vw,30px)}
.tg-clock{position:relative;width:min(70vw,260px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line)}
.tg-clock .digits{font-size:clamp(34px,11vw,52px);position:relative;z-index:1}
.tg-ring{position:absolute;inset:14%;border-radius:50%;border:4px solid var(--gold);opacity:0}
.tg-ring.on{animation:tgp .87s ease-out infinite}
@keyframes tgp{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.tg-ring.on{animation:none;opacity:.4}}

/* Rechnen */
.rc{display:grid;gap:12px}
.rc-task{font-family:var(--f-mono);font-weight:800;font-size:clamp(34px,10vw,52px);text-align:center;font-variant-numeric:tabular-nums}
.rc-in{color:var(--cobalt)}
.rc-in.bad{color:var(--bad)}

/* Farbe */
.fb{display:grid;gap:14px}
.fb-swatch{height:min(38vh,260px);border-radius:20px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:60px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.fb-split{display:grid;grid-template-columns:1fr 1fr;border-radius:20px;overflow:hidden;border:2px solid var(--line);height:min(30vh,200px)}
.fb-split div{display:grid;place-items:end start;padding:10px;font-weight:800;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.sl{display:grid;gap:4px}
.sl label{font-weight:800;font-size:13px;display:flex;justify-content:space-between}
.sl input{width:100%;height:34px;-webkit-appearance:none;appearance:none;border-radius:99px;background:var(--surface-2);border:2px solid var(--line);margin:0}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #141A33;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:grab}
.sl input::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #141A33;cursor:grab}

/* Merken */
.mk{display:grid;gap:14px}
.mk-num{font-family:var(--f-mono);font-weight:800;font-size:clamp(30px,10vw,60px);text-align:center;letter-spacing:.06em;overflow-wrap:anywhere;padding:24px 8px;background:var(--surface);border:2px solid var(--line);border-radius:18px;font-variant-numeric:tabular-nums}
.diff span.bad{color:var(--bad);text-decoration:underline}

/* ---------- Boards & tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border-bottom:2px solid var(--line);font-weight:800}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.num{font-weight:800}
tr.me td{background:color-mix(in oklab,var(--tomato) 9%,var(--surface))}
.who{display:flex;gap:8px;align-items:center;min-width:0}
.who .em{font-size:20px}
.who small{display:block;color:var(--ink-2);font-size:12px;max-width:28ch;overflow:hidden;text-overflow:ellipsis}
.pos{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--f-mono);font-weight:800;font-size:13px;background:var(--surface-2)}
.pos.p1{background:var(--gold);color:var(--on-gold)}
.pos.p2{background:#B9C2D6;color:#1E2540}
.pos.p3{background:#D69A6A;color:#2A1606}
.gb-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.gb-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gb-head h3{font-family:var(--f-display);font-weight:400;font-size:15px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.rr.me .rr-who{color:var(--tomato)}
.rr-who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr-who small{font-weight:500;color:var(--ink-2)}
.rr-p{font-size:15px}

/* ---------- Tours ---------- */
.tour-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.tcard{display:grid;gap:10px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;box-shadow:0 4px 0 var(--line);min-width:0}
.tcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tcard h3{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.1;word-break:break-word}
.tcard-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.icrow{display:flex;gap:4px;flex-wrap:wrap}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--cobalt)}
.tg-list{display:grid;gap:8px}
.tg-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;flex-wrap:wrap}
.tg-name{font-weight:800;flex:1;min-width:110px}
.tg-res{font-size:14px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;max-width:460px}
.pod{display:grid;justify-items:center;gap:4px;text-align:center;min-width:0}
.pod .em{font-size:34px}
.pod b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod-block{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px}
.pod.p1 .pod-block{height:96px;background:var(--gold);color:var(--on-gold)}
.pod.p2 .pod-block{height:70px;background:#B9C2D6;color:#1E2540}
.pod.p3 .pod-block{height:52px;background:#D69A6A;color:#2A1606}
.back{border:0;background:none;padding:0;font-weight:800;color:var(--ink-2);cursor:pointer;justify-self:start}
.cell-p{display:grid;line-height:1.15}
.cell-p small{color:var(--ink-2);font-family:var(--f-body);font-weight:600;font-size:11px}

/* ---------- Profile ---------- */
.prof{display:grid;gap:16px;max-width:760px}
.form{display:grid;gap:14px}

/* ---------- Live-Party ---------- */
.party-card{background:var(--surface);border:2px solid var(--tomato);border-radius:18px;padding:16px;display:grid;gap:12px;box-shadow:0 4px 0 color-mix(in oklab,var(--tomato) 40%,var(--line));min-width:0}
.party-card .sec-head{margin:0}
.code-in{display:flex;gap:8px;flex-wrap:nowrap}
.code-in .inp{text-transform:uppercase;letter-spacing:.2em;font-family:var(--f-mono);font-weight:800;width:120px}
.pcode{font-family:var(--f-display);font-size:clamp(44px,13vw,68px);letter-spacing:.12em;line-height:1;color:var(--tomato)}
.lobby-grid{display:grid;gap:14px}
@media (min-width:860px){.lobby-grid{grid-template-columns:1fr 1fr}}
.member{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2);flex-wrap:wrap}
.member .em{font-size:26px;line-height:1}
.live-wrap{display:grid;gap:10px;max-width:760px;margin:0 auto}
.hud{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:6;background:var(--bg);display:grid;gap:8px;padding-block:6px;border-bottom:2px solid var(--line)}
.hud-top{display:flex;align-items:center;gap:8px}
.hud-time{font-family:var(--f-mono);font-weight:800;font-size:17px;padding:7px 10px;border-radius:10px;background:var(--ink);color:var(--bg);font-variant-numeric:tabular-nums;min-width:66px;text-align:center}
.hud-time.low{background:var(--tomato);color:var(--on-accent)}
.hud-round{flex:1;min-width:0;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv{display:flex;gap:6px}
.slot{width:50px;height:50px;border-radius:13px;border:2px dashed var(--line);background:var(--surface);font-size:26px;display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation}
.slot:disabled{cursor:default;opacity:1}
.slot.full{border-style:solid;border-color:var(--gold);background:color-mix(in oklab,var(--gold) 22%,var(--surface));box-shadow:0 3px 0 var(--gold)}
.slot.sel{outline:3px solid var(--tomato);outline-offset:2px}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:7px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 10px 5px 7px;font-size:12.5px;line-height:1.2;text-align:left;max-width:190px;color:var(--ink)}
.pchip b{font-weight:800;display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .em{font-size:20px}
.pchip small{color:var(--ink-2);white-space:nowrap;display:block}
.pchip.me{border-color:var(--cobalt)}
.pchip.done small{color:var(--good);font-weight:800}
.pchip.target{cursor:pointer;border-color:var(--tomato);background:color-mix(in oklab,var(--tomato) 14%,var(--surface));animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.feed{font-size:13px;font-weight:700;color:var(--ink-2);min-height:1.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed.pick{color:var(--tomato)}
.feed.note{color:var(--ink);background:var(--surface-2);border-radius:8px;padding:2px 8px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;animation:tin .2s ease}
.feed.note.big{background:var(--gold);color:var(--on-gold)}
.ingame .fx-small{top:16%;font-size:clamp(20px,6vw,34px);text-shadow:2px 2px 0 var(--ink)}
.ingame .fx-small small{font-size:13px}
.live-stage{position:relative;min-height:200px}
.fxw{transition:transform .35s ease,filter .35s ease;transform-origin:50% 25%}
.fxw.mirror{transform:scaleX(-1)}
.fxw.shrink{transform:scale(.5)}
.fxw.mirror.shrink{transform:scaleX(-1) scale(.5)}
.fxw.fog{filter:blur(9px) saturate(.5)}
.ice-ov{position:absolute;inset:-6px;z-index:8;border-radius:18px;background:repeating-linear-gradient(135deg,rgba(160,215,255,.8) 0 14px,rgba(215,240,255,.9) 14px 28px);display:grid;place-items:center;font-size:76px;animation:tin .2s}
.bubble{position:absolute;z-index:7;width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);background:var(--surface);font-size:32px;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px -6px rgba(0,0,0,.45);animation:bob 1s ease-in-out infinite;padding:0;touch-action:manipulation}
@keyframes bob{50%{transform:translateY(-8px) rotate(8deg)}}
.wait-card{display:grid;justify-items:center;gap:10px;text-align:center;padding:26px 12px}
.cd-num{font-family:var(--f-display);font-size:clamp(96px,30vw,170px);line-height:1;color:var(--tomato)}
.items-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.il{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.35}
.il > span:first-child{font-size:24px;line-height:1}
.fx-small{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(28px,9vw,54px);color:var(--cobalt);text-shadow:3px 3px 0 var(--ink);text-align:center;animation:pop 1.3s ease forwards;white-space:nowrap}

.lj{justify-items:stretch}

/* ---------- Farbgedächtnis live: alle mischen dieselbe Farbe, danach liegen alle Farben nebeneinander ---------- */

        h('div', { class: 'hl-card' }, h('div', { class: 'eyebrow' }, q[1]), h('div', { class: 'hl-name' }, q[5]), h('div', { class: 'hl-val' }, hlFmt(q[6], q[4]))),
